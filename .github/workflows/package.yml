name: Package candidate validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to validate locally
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: package-candidate-validation
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate requested version and registry
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(pkg.version, process.env.CANDIDATE_VERSION);
          assert.equal(pkg.name, '@seventwo-studio/block-editor');
          assert.equal(pkg.publishConfig.registry, 'https://npm.pkg.github.com');
          assert.equal(pkg.publishConfig.access, undefined);
          JS
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run demo:typecheck
      - run: bun run test
      - run: bun run demo:build
      - run: bun run check:package
