name: Internal package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package.json version to publish
        type: string
        required: true
      approved:
        description: Package visibility/access and any additional spending have been approved
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: internal-package-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.approved && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate requested version and registry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(pkg.name, '@seventwo-studio/block-editor');
          assert.equal(pkg.publishConfig.registry, 'https://npm.pkg.github.com');
          assert.equal(pkg.publishConfig.access, undefined);
          JS
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run demo:typecheck
      - run: bun run test
      - run: bun run demo:build
      - run: bun run check:package
      - name: Require private visibility if the package already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/orgs/seventwo-studio/packages/npm/block-editor)
          if [ "$code" = 200 ]; then
            jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json"
          elif [ "$code" != 404 ]; then
            echo "Cannot verify package visibility (HTTP $code)." >&2
            exit 1
          fi
      - name: Publish reviewed version to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/package-auth.npmrc
        run: |
          umask 077
          # Keep the placeholder literal; npm expands it without writing the token to disk.
          # shellcheck disable=SC2016
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          npm publish --ignore-scripts --registry=https://npm.pkg.github.com
      - name: Confirm package remains private
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api orgs/seventwo-studio/packages/npm/block-editor --jq .visibility | grep -x private
